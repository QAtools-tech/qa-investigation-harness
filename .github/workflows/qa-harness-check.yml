name: QA harness checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  artifact-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke-test packed installer for each client
        run: node scripts/check-packed-installer.mjs
      - name: Check synthetic artifacts
        run: node qa-harness/checks/qa-check.mjs --root qa-harness/fixtures/checks
      - name: Run offline Playwright report fixture
        run: node --test qa-harness/checks/qa-run-report.test.mjs
      - name: Run installer upgrade tests
        run: node --test scripts/installer.test.mjs
      - name: Run checker tests
        run: node --test qa-harness/checks/*.test.mjs
